[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sileo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "torch-geometric>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["components*", "models*", "datasets*", "evaluation*", "utils*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
